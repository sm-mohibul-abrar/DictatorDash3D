<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Dictator's Dash 3D</title>
  <meta name="description" content="Endless 3D lane-runner: a faithful web port of a PyOpenGL / GLUT course project.">
  <link rel="stylesheet" href="web/css/style.css">
</head>
<body>
  <!-- 3D world (Three.js, driven by glshim.js) and the 2D HUD drawn on top of it -->
  <canvas id="c"></canvas>
  <canvas id="hud"></canvas>

  <!-- Touch controls (phones only). They call the same game actions as the keyboard. -->
  <div id="touch-left">
    <button id="be" class="m-ctrl-btn" aria-label="Faster (E)">
      <svg viewBox="0 0 24 24"><path d="M6 13l6-6 6 6M6 19l6-6 6 6"/></svg>
    </button>
    <button id="bq" class="m-ctrl-btn" aria-label="Slower (Q)">
      <svg viewBox="0 0 24 24"><path d="M6 5l6 6 6-6M6 11l6 6 6-6"/></svg>
    </button>
  </div>
  <!-- right column: utility buttons on top, FLAME at the bottom; one flex column so they never overlap -->
  <div id="touch-right">
    <div class="m-group">
      <button id="bp" class="m-ctrl-btn" aria-label="Pause (P)">
        <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
      </button>
      <button id="bv" class="m-ctrl-btn" aria-label="Camera view (V)">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <button id="bt" class="m-ctrl-btn" aria-label="Time of day (N)">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
      <button id="bw" class="m-ctrl-btn" aria-label="Weather (M)">
        <svg viewBox="0 0 24 24"><path d="M7 15a4 4 0 1 1 1-7.9A5 5 0 0 1 17.6 9 3 3 0 1 1 17 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></svg>
      </button>
    </div>
    <button id="bf" class="m-ctrl-btn" aria-label="Flamethrower (hold, G)">
      <svg viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 1.5-5 3-6 0 2 1 3.5 2.5 4C11 9 10 5 12 2z"/></svg>
    </button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="web/js/glshim.js"></script>
  <script src="web/js/game.js"></script>
</body>
</html>
