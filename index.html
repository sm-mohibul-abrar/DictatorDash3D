<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Dictator's Dash 3D</title>
  <meta name="description" content="Endless 3D lane-runner: a faithful web port of a PyOpenGL / GLUT course project.">
  <link rel="stylesheet" href="web/css/style.css">
</head>
<body>
  <!-- 3D world (Three.js, driven by glshim.js) and the 2D HUD drawn on top of it -->
  <canvas id="c"></canvas>
  <canvas id="hud"></canvas>

  <!-- Touch controls (phones only). They call the same game actions as the keyboard. -->
  <div id="touch-left">
    <button id="be" class="m-ctrl-btn" aria-label="Faster">&#9650;</button>
    <button id="bq" class="m-ctrl-btn" aria-label="Slower">&#9660;</button>
  </div>
  <div id="touch-right">
    <button id="bp" class="m-ctrl-btn" aria-label="Pause">&#10074;&#10074;</button>
    <button id="bv" class="m-ctrl-btn" aria-label="Camera view">V</button>
    <button id="bt" class="m-ctrl-btn" aria-label="Time of day">N</button>
    <button id="bw" class="m-ctrl-btn" aria-label="Weather">M</button>
  </div>
  <button id="bf" class="m-ctrl-btn" aria-label="Flamethrower">FLAME</button>

  <div id="rotate">Rotate your phone to landscape</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="web/js/glshim.js"></script>
  <script src="web/js/game.js"></script>
</body>
</html>
